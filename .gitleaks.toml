title = "AAS secret scanning"
minVersion = "v8.30.1"

[extend]
useDefault = true

# Reviewed synthetic test constants. Each entry names one exact literal that is not a credential.
[[allowlists]]
description = "Synthetic Qveris API key used by provider-client tests"
regexTarget = "secret"
regexes = ['''^qv-synthetic-key-0123456789abcdef$''']
