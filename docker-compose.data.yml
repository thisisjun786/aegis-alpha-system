{
  "name": "aas-data-${AAS_INSTALL_ID:?AAS_INSTALL_ID is required}",
  "services": {
    "aas": {
      "image": "${AAS_DATA_IMAGE:?AAS_DATA_IMAGE is required}",
      "pull_policy": "never",
      "command": ["db", "status"],
      "user": "${AAS_UID:?AAS_UID is required}:${AAS_GID:?AAS_GID is required}",
      "labels": {"aas.installation": "${AAS_INSTALL_ID:?AAS_INSTALL_ID is required}", "aas.role": "aas"},
      "environment": {
        "AAS_DATA_CONFIG": "/config/runtime.json",
        "AAS_COLLECTION_CONFIG": "/config/collection.json",
        "AAS_COLLECTION_STATE": "/state/collection",
        "AAS_COMPUTE_LOCK_FILE": "/state/compute.lock",
        "AAS_HOST_CPU_LIMIT": "${AAS_HOST_CPU_LIMIT:?AAS_HOST_CPU_LIMIT is required}",
        "AAS_HOST_MEMORY_LIMIT_BYTES": "${AAS_HOST_MEMORY_LIMIT_BYTES:?AAS_HOST_MEMORY_LIMIT_BYTES is required}"
      },
      "volumes": [
        {"type": "bind", "source": "${AAS_INSTALL_ROOT:?AAS_INSTALL_ROOT is required}/config", "target": "/config", "read_only": true, "bind": {"create_host_path": false}},
        {"type": "bind", "source": "${AAS_INSTALL_ROOT:?AAS_INSTALL_ROOT is required}/state", "target": "/state", "read_only": false, "bind": {"create_host_path": false}},
        {"type": "bind", "source": "${AAS_INSTALL_ROOT:?AAS_INSTALL_ROOT is required}/secrets/container-runtime-url", "target": "/run/secrets/runtime-url", "read_only": true, "bind": {"create_host_path": false}},
        {"type": "bind", "source": "${AAS_DATA_ROOT:?AAS_DATA_ROOT is required}/raw", "target": "/data/aegis-alpha-system/raw", "read_only": true, "bind": {"create_host_path": false}},
        {"type": "bind", "source": "${AAS_DATA_ROOT:?AAS_DATA_ROOT is required}/normalized", "target": "/data/aegis-alpha-system/normalized", "read_only": true, "bind": {"create_host_path": false}},
        {"type": "bind", "source": "${AAS_DATA_ROOT:?AAS_DATA_ROOT is required}/owner-receipts", "target": "/data/aegis-alpha-system/owner-receipts", "read_only": true, "bind": {"create_host_path": false}},
        {"type": "bind", "source": "${AAS_DATA_ROOT:?AAS_DATA_ROOT is required}/canonical", "target": "/data/aegis-alpha-system/canonical", "read_only": true, "bind": {"create_host_path": false}},
        {"type": "bind", "source": "${AAS_DATA_ROOT:?AAS_DATA_ROOT is required}/identity", "target": "/data/aegis-alpha-system/identity", "read_only": true, "bind": {"create_host_path": false}},
        {"type": "bind", "source": "${AAS_FMP_USAGE_TRUST_DIR:?AAS_FMP_USAGE_TRUST_DIR is required}", "target": "/data/aegis-alpha-system/artifacts/fmp", "read_only": true, "bind": {"create_host_path": false}}
      ],
      "networks": ["database"],
      "read_only": true,
      "cap_drop": ["ALL"],
      "security_opt": ["no-new-privileges:true"],
      "tmpfs": ["/tmp:rw,nosuid,nodev,size=256m,mode=1777"],
      "cpus": "${AAS_CONTAINER_CPU_LIMIT:?AAS_CONTAINER_CPU_LIMIT is required}",
      "mem_limit": "${AAS_CONTAINER_MEMORY_BYTES:?AAS_CONTAINER_MEMORY_BYTES is required}",
      "pids_limit": 512,
      "stop_signal": "SIGINT",
      "stop_grace_period": "5m",
      "restart": "no"
    },
    "collector": {
      "image": "${AAS_DATA_IMAGE:?AAS_DATA_IMAGE is required}",
      "pull_policy": "never",
      "command": ["collect", "daily"],
      "user": "${AAS_UID:?AAS_UID is required}:${AAS_GID:?AAS_GID is required}",
      "labels": {"aas.installation": "${AAS_INSTALL_ID:?AAS_INSTALL_ID is required}", "aas.role": "collector"},
      "environment": {
        "AAS_DATA_CONFIG": "/config/runtime.json",
        "AAS_COLLECTION_CONFIG": "/config/collection.json",
        "AAS_COLLECTION_STATE": "/state/collection",
        "AAS_COMPUTE_LOCK_FILE": "/state/compute.lock",
        "AAS_HOST_CPU_LIMIT": "${AAS_HOST_CPU_LIMIT:?AAS_HOST_CPU_LIMIT is required}",
        "AAS_HOST_MEMORY_LIMIT_BYTES": "${AAS_HOST_MEMORY_LIMIT_BYTES:?AAS_HOST_MEMORY_LIMIT_BYTES is required}"
      },
      "volumes": [
        {"type": "bind", "source": "${AAS_INSTALL_ROOT:?AAS_INSTALL_ROOT is required}/config", "target": "/config", "read_only": true, "bind": {"create_host_path": false}},
        {"type": "bind", "source": "${AAS_INSTALL_ROOT:?AAS_INSTALL_ROOT is required}/state", "target": "/state", "read_only": false, "bind": {"create_host_path": false}},
        {"type": "bind", "source": "${AAS_INSTALL_ROOT:?AAS_INSTALL_ROOT is required}/secrets/container-runtime-url", "target": "/run/secrets/runtime-url", "read_only": true, "bind": {"create_host_path": false}},
        {"type": "bind", "source": "${AAS_FMP_CREDENTIAL_FILE:?AAS_FMP_CREDENTIAL_FILE is required}", "target": "/run/secrets/fmp.env", "read_only": true, "bind": {"create_host_path": false}},
        {"type": "bind", "source": "${AAS_FMP_OWNER_TRUST_FILE:?AAS_FMP_OWNER_TRUST_FILE is required}", "target": "/etc/aegis-trust/owner-authority.json", "read_only": true, "bind": {"create_host_path": false}},
        {"type": "bind", "source": "${AAS_FMP_USAGE_TRUST_DIR:?AAS_FMP_USAGE_TRUST_DIR is required}", "target": "/data/aegis-alpha-system/artifacts/fmp", "read_only": true, "bind": {"create_host_path": false}},
        {"type": "bind", "source": "${AAS_DATA_ROOT:?AAS_DATA_ROOT is required}/raw", "target": "/data/aegis-alpha-system/raw", "read_only": false, "bind": {"create_host_path": false}},
        {"type": "bind", "source": "${AAS_DATA_ROOT:?AAS_DATA_ROOT is required}/normalized", "target": "/data/aegis-alpha-system/normalized", "read_only": false, "bind": {"create_host_path": false}},
        {"type": "bind", "source": "${AAS_DATA_ROOT:?AAS_DATA_ROOT is required}/owner-receipts", "target": "/data/aegis-alpha-system/owner-receipts", "read_only": false, "bind": {"create_host_path": false}},
        {"type": "bind", "source": "${AAS_DATA_ROOT:?AAS_DATA_ROOT is required}/canonical", "target": "/data/aegis-alpha-system/canonical", "read_only": true, "bind": {"create_host_path": false}},
        {"type": "bind", "source": "${AAS_DATA_ROOT:?AAS_DATA_ROOT is required}/identity", "target": "/data/aegis-alpha-system/identity", "read_only": true, "bind": {"create_host_path": false}},
        {"type": "bind", "source": "${AAS_DATA_ROOT:?AAS_DATA_ROOT is required}/normalized/norgate", "target": "/data/aegis-alpha-system/normalized/norgate", "read_only": true, "bind": {"create_host_path": false}},
        {"type": "bind", "source": "${AAS_DATA_ROOT:?AAS_DATA_ROOT is required}/raw/norgate", "target": "/data/aegis-alpha-system/raw/norgate", "read_only": true, "bind": {"create_host_path": false}},
        {"type": "bind", "source": "${AAS_FMP_REVOCATIONS_DIR:?AAS_FMP_REVOCATIONS_DIR is required}", "target": "/data/aegis-alpha-system/raw/fmp/authority-revocations", "read_only": true, "bind": {"create_host_path": false}}
      ],
      "networks": ["database", "egress"],
      "read_only": true,
      "cap_drop": ["ALL"],
      "security_opt": ["no-new-privileges:true"],
      "tmpfs": ["/tmp:rw,nosuid,nodev,size=256m,mode=1777"],
      "cpus": "${AAS_CONTAINER_CPU_LIMIT:?AAS_CONTAINER_CPU_LIMIT is required}",
      "mem_limit": "${AAS_CONTAINER_MEMORY_BYTES:?AAS_CONTAINER_MEMORY_BYTES is required}",
      "pids_limit": 512,
      "stop_signal": "SIGINT",
      "stop_grace_period": "5m",
      "restart": "no"
    },
    "admin": {
      "profiles": ["maintenance"],
      "image": "${AAS_DATA_IMAGE:?AAS_DATA_IMAGE is required}",
      "pull_policy": "never",
      "command": ["db", "status"],
      "user": "${AAS_UID:?AAS_UID is required}:${AAS_GID:?AAS_GID is required}",
      "labels": {"aas.installation": "${AAS_INSTALL_ID:?AAS_INSTALL_ID is required}", "aas.role": "admin"},
      "environment": {
        "AAS_DATA_CONFIG": "/config/runtime.json",
        "AAS_COLLECTION_CONFIG": "/config/collection.json",
        "AAS_COLLECTION_STATE": "/state/collection",
        "AAS_COMPUTE_LOCK_FILE": "/state/compute.lock",
        "AAS_HOST_CPU_LIMIT": "${AAS_HOST_CPU_LIMIT:?AAS_HOST_CPU_LIMIT is required}",
        "AAS_HOST_MEMORY_LIMIT_BYTES": "${AAS_HOST_MEMORY_LIMIT_BYTES:?AAS_HOST_MEMORY_LIMIT_BYTES is required}"
      },
      "volumes": [
        {"type": "bind", "source": "${AAS_INSTALL_ROOT:?AAS_INSTALL_ROOT is required}/config", "target": "/config", "read_only": true, "bind": {"create_host_path": false}},
        {"type": "bind", "source": "${AAS_INSTALL_ROOT:?AAS_INSTALL_ROOT is required}/state", "target": "/state", "read_only": false, "bind": {"create_host_path": false}},
        {"type": "bind", "source": "${AAS_INSTALL_ROOT:?AAS_INSTALL_ROOT is required}/secrets/container-runtime-url", "target": "/run/secrets/runtime-url", "read_only": true, "bind": {"create_host_path": false}},
        {"type": "bind", "source": "${AAS_INSTALL_ROOT:?AAS_INSTALL_ROOT is required}/secrets/container-admin-url", "target": "/run/secrets/admin-url", "read_only": true, "bind": {"create_host_path": false}},
        {"type": "bind", "source": "${AAS_INSTALL_ROOT:?AAS_INSTALL_ROOT is required}/secrets/runtime-password", "target": "/run/secrets/runtime-password", "read_only": true, "bind": {"create_host_path": false}},
        {"type": "bind", "source": "${AAS_DATA_ROOT:?AAS_DATA_ROOT is required}/raw", "target": "/data/aegis-alpha-system/raw", "read_only": true, "bind": {"create_host_path": false}},
        {"type": "bind", "source": "${AAS_DATA_ROOT:?AAS_DATA_ROOT is required}/normalized", "target": "/data/aegis-alpha-system/normalized", "read_only": true, "bind": {"create_host_path": false}},
        {"type": "bind", "source": "${AAS_DATA_ROOT:?AAS_DATA_ROOT is required}/owner-receipts", "target": "/data/aegis-alpha-system/owner-receipts", "read_only": true, "bind": {"create_host_path": false}},
        {"type": "bind", "source": "${AAS_DATA_ROOT:?AAS_DATA_ROOT is required}/canonical", "target": "/data/aegis-alpha-system/canonical", "read_only": true, "bind": {"create_host_path": false}},
        {"type": "bind", "source": "${AAS_DATA_ROOT:?AAS_DATA_ROOT is required}/identity", "target": "/data/aegis-alpha-system/identity", "read_only": true, "bind": {"create_host_path": false}},
        {"type": "bind", "source": "${AAS_FMP_USAGE_TRUST_DIR:?AAS_FMP_USAGE_TRUST_DIR is required}", "target": "/data/aegis-alpha-system/artifacts/fmp", "read_only": true, "bind": {"create_host_path": false}}
      ],
      "networks": ["database"],
      "read_only": true,
      "cap_drop": ["ALL"],
      "security_opt": ["no-new-privileges:true"],
      "tmpfs": ["/tmp:rw,nosuid,nodev,size=256m,mode=1777"],
      "cpus": "${AAS_CONTAINER_CPU_LIMIT:?AAS_CONTAINER_CPU_LIMIT is required}",
      "mem_limit": "${AAS_CONTAINER_MEMORY_BYTES:?AAS_CONTAINER_MEMORY_BYTES is required}",
      "pids_limit": 512,
      "stop_signal": "SIGINT",
      "stop_grace_period": "5m",
      "restart": "no"
    },
    "postgres": {
      "profiles": ["database"],
      "image": "postgres:18.4-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296",
      "pull_policy": "never",
      "labels": {"aas.installation": "${AAS_INSTALL_ID:?AAS_INSTALL_ID is required}", "aas.role": "postgres"},
      "environment": {
        "POSTGRES_DB": "postgres",
        "POSTGRES_USER": "aas_owner",
        "POSTGRES_PASSWORD_FILE": "/run/secrets/postgres-password",
        "POSTGRES_INITDB_ARGS": "--data-checksums"
      },
      "volumes": [
        {"type": "volume", "source": "postgres-data", "target": "/var/lib/postgresql"},
        {"type": "bind", "source": "${AAS_INSTALL_ROOT:?AAS_INSTALL_ROOT is required}/secrets/postgres-owner-password", "target": "/run/secrets/postgres-password", "read_only": true, "bind": {"create_host_path": false}}
      ],
      "networks": ["database"],
      "security_opt": ["no-new-privileges:true"],
      "read_only": true,
      "tmpfs": ["/tmp:rw,nosuid,nodev,size=64m,mode=1777", "/var/run/postgresql:rw,nosuid,nodev,size=16m,mode=1777"],
      "shm_size": "128m",
      "cpus": 2,
      "mem_limit": "${AAS_POSTGRES_MEMORY_BYTES:-2147483648}",
      "pids_limit": 256,
      "restart": "unless-stopped",
      "healthcheck": {
        "test": ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""],
        "interval": "5s",
        "timeout": "3s",
        "retries": 20,
        "start_period": "10s"
      }
    }
  },
  "networks": {
    "database": {"external": true, "name": "${AAS_DATABASE_NETWORK:?AAS_DATABASE_NETWORK is required}"},
    "egress": {"driver": "bridge", "internal": false}
  },
  "volumes": {
    "postgres-data": {"external": true, "name": "${AAS_POSTGRES_VOLUME:?AAS_POSTGRES_VOLUME is required}"}
  }
}
