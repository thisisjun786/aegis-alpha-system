<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>AAS 연구 자료실</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">본문으로 건너뛰기</a>
    <div class="app-shell">
      <aside class="sidebar" aria-label="콘솔 탐색">
        <header class="brand"><span aria-hidden="true">A</span><div><strong>AAS</strong><small>연구 자료실</small></div></header>
        <nav class="nav-list" aria-label="주 메뉴">
          <button class="nav-item is-active" type="button" data-view="strategies">전략 목록</button>
          <button class="nav-item" type="button" data-view="coverage">데이터 수집 현황</button>
          <button class="nav-item" type="button" data-view="resources">내 자료 · 메모</button>
          <details class="advanced-nav"><summary>저장소 상세</summary>
            <button class="nav-item" type="button" data-view="storage">저장 공간</button>
            <button class="nav-item" type="button" data-view="sources">원본 테이블</button>
            <button class="nav-item" type="button" data-view="datasets">데이터 발행 기록</button>
            <button class="nav-item" type="button" data-view="runs">실행 기록</button>
          </details>
        </nav>
        <footer class="sidebar-foot"><span class="status-dot" aria-hidden="true"></span><span id="catalog-status">카탈로그 확인 중</span></footer>
      </aside>
      <main id="main" tabindex="-1">
        <header class="topbar">
          <div><p class="eyebrow">내 연구 자료</p><h1 id="page-title">전략 목록</h1></div>
          <div class="topbar-actions"><span id="observed-at" class="muted">관측 정보 없음</span><button id="refresh-button" class="button button-secondary" type="button">새로고침</button></div>
        </header>
        <div id="message-region" class="message-region" role="status" aria-live="polite"></div>
        <section id="view" class="view" aria-live="polite">
          <div class="loading"><span class="spinner" aria-hidden="true"></span>카탈로그를 불러오는 중입니다</div>
        </section>
      </main>
    </div>
    <aside id="detail-drawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" aria-hidden="true" inert>
      <div class="drawer-head"><div><p class="eyebrow" id="drawer-kicker">상세</p><h2 id="drawer-title">선택한 항목</h2></div><button id="close-drawer" class="icon-button" type="button" aria-label="상세 패널 닫기">×</button></div>
      <div id="drawer-content" class="drawer-content"></div>
    </aside>
    <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
    <script src="app.js" defer></script>
  </body>
</html>
